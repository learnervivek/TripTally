<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D15"/>
      <stop offset="60%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#122E22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#2D6A4F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F4EAD4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    
    <!-- Top Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="42" rx="21" fill="#2D6A4F" fill-opacity="0.6" stroke="#40916C" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="6" fill="#E07A5F"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FAF8F5" letter-spacing="1">AI TRAVEL PLANNER FOR INDIA</text>
    </g>

    <!-- Logo & Brand Name -->
    <g transform="translate(0, 80)">
      <!-- Logo Icon -->
      <rect width="72" height="72" rx="18" fill="#2D6A4F" filter="url(#shadow)"/>
      <circle cx="36" cy="36" r="22" stroke="#FAF8F5" stroke-width="3" fill="none"/>
      <polygon points="36,18 42,36 36,54 30,36" fill="#E07A5F"/>
      <polygon points="18,36 36,42 54,36 36,30" fill="#FAF8F5"/>
      <circle cx="36" cy="36" r="4" fill="#0B1D15"/>

      <!-- Brand Text -->
      <text x="96" y="52" font-family="Georgia, serif" font-size="52" font-weight="800" fill="#FAF8F5">
        Trip<tspan fill="#E07A5F">Tally</tspan>
      </text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="240" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#FAF8F5" line-height="1.2">
      Plan Better Trips with Friends.
    </text>
    <text x="0" y="295" font-family="Georgia, serif" font-size="44" font-weight="400" font-style="italic" fill="#8FD5A6">
      Smarter Itineraries &amp; Fair Rupee Splits.
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#C5D3C9">
      Personalised day-by-day plans, interactive maps, debt simplification &amp; UPI settlements.
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 400)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="230" height="40" rx="12" fill="#143426" stroke="#2D6A4F" stroke-width="1.2"/>
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#E07A5F">✦ Gemini 2.5 AI Itinerary</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(250, 0)">
        <rect width="210" height="40" rx="12" fill="#143426" stroke="#2D6A4F" stroke-width="1.2"/>
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FAF8F5">₹ Fair Split &amp; UPI</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="40" rx="12" fill="#143426" stroke="#2D6A4F" stroke-width="1.2"/>
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FAF8F5">👥 Group Workspace</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(720, 0)">
        <rect width="180" height="40" rx="12" fill="#143426" stroke="#2D6A4F" stroke-width="1.2"/>
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#8FD5A6">100% Free</text>
      </g>
    </g>

  </g>
</svg>

